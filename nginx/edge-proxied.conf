# Mounted as conf.d/00-edge.conf behind the shared host proxy. The container port is
# bound to loopback, so the only possible peer is that proxy (seen here as the Docker
# bridge gateway) and its headers can be trusted.

# Without this every request appears to come from one address and the per-IP
# limit_req zones would throttle all visitors as a single client.
set_real_ip_from 127.0.0.0/8;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;

# TLS ends at the host proxy; ProxyFix in the backend needs the original scheme.
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    https   https;
}
