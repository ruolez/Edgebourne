# Dev overlay: live code reload + postgres exposed on host port 5480.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Ads console: http://ads.localhost:8090
services:
  nginx:
    volumes:
      - ./ads/nginx/ads.conf:/etc/nginx/conf.d/zz-ads.conf:ro
      - ./ads/frontend:/srv/ads:ro
      - ./ads/dev/media:/srv/dev-media:ro

  ads-backend:
    volumes:
      - ./ads/backend:/app
    environment:
      - GUNICORN_RELOAD=1
      - APP_BASE_URL=http://ads.localhost:${APP_PORT:-8090}
      # Talk to the fake Graph API below instead of Meta. To use real Meta locally, set
      # ADS_FAKE_META_BASE=https://graph.facebook.com/v24.0 in .env.
      - META_GRAPH_BASE=${ADS_FAKE_META_BASE:-http://fake-meta:5001/v24.0}
      # Telegram also goes to the stand-in; the fake bot token is 123456:FAKE-token.
      - TELEGRAM_API_BASE=${ADS_FAKE_TELEGRAM_BASE:-http://fake-meta:5001/telegram}

  # Local stand-in for the Meta Graph API (ads/dev/fake_meta.py).
  fake-meta:
    build: ./ads/backend
    container_name: edgebourne-fake-meta
    command: ["python", "/dev-tools/fake_meta.py"]
    volumes:
      - ./ads/dev:/dev-tools:ro

  backend:
    volumes:
      - ./backend:/app
      - uploads:/data/uploads
    command: >
      sh -c "exec gunicorn --bind 0.0.0.0:5000 --workers 1 --threads 4
      --timeout 300 --reload 'app:create_app()'"

  scheduler:
    volumes:
      - ./backend:/app
    environment:
      - SCHEDULER_TICK_SECONDS=10

  postgres:
    ports:
      - "5480:5432"
