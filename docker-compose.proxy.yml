# Shared-proxy overlay: a host-level nginx owns 80/443 and terminates TLS for every
# app on the server (github.com/ruolez/shared-proxy). This stack only listens on
# loopback — Docker-published ports bypass ufw, so the bind address is the firewall.
# Activated by install.sh via COMPOSE_FILE in .env; expects APP_PORT=<loopback port>.
services:
  nginx:
    ports: !override
      - "127.0.0.1:${APP_PORT:-8090}:80"
    volumes:
      - ./nginx/edge-proxied.conf:/etc/nginx/conf.d/00-edge.conf:ro
