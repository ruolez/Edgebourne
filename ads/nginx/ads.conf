# Ads console at ads.<domain>, served by the same nginx container as the site.
# Mounted as conf.d/zz-ads.conf (after default.conf, which stays the default server)
# by docker-compose.proxy.yml, where the shared host proxy terminates TLS for
# ads.<domain>, and by docker-compose.dev.yml (http://ads.localhost:8090). It is not
# mounted in direct mode: there is no certificate for ads.<domain> there.
# $fwd_proto comes from conf.d/00-edge.conf.

limit_req_zone $binary_remote_addr zone=adslogin:10m rate=10r/m;

server {
    listen 80;
    server_name ~^ads\.;
    root /srv/ads;
    index index.html;
    server_tokens off;
    client_max_body_size 2m;

    # Looked up per request, so nginx (and the main site) still starts when the
    # ads backend is down or not built yet.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $ads_backend http://ads-backend:5000;

    # Locations below set caching with "expires", not add_header, so these headers
    # are inherited everywhere (any add_header in a location would drop them).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.fbcdn.net https://*.facebook.com; style-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /fonts/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /api/auth/login {
        limit_req zone=adslogin burst=5 nodelay;
        proxy_pass $ads_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location /api/ {
        proxy_pass $ads_backend;
        proxy_read_timeout 120s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # Meta's lead pings. The body reaches Flask byte for byte for the signature check.
    location /webhooks/ {
        proxy_pass $ads_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
