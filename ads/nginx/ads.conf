# Ads console at ads.<domain>, served by the same nginx container as the site.
# Mounted as conf.d/zz-ads.conf (after default.conf, which stays the default server)
# by docker-compose.proxy.yml, where the shared host proxy terminates TLS for
# ads.<domain>, and by docker-compose.dev.yml (http://ads.localhost:8090). It is not
# mounted in direct mode: there is no certificate for ads.<domain> there.
# $fwd_proto comes from conf.d/00-edge.conf.

limit_req_zone $binary_remote_addr zone=adslogin:10m rate=10r/m;

server {
    listen 80;
    server_name ~^ads\.;
    root /srv/ads;
    index index.html;
    server_tokens off;
    client_max_body_size 2m;

    # Looked up per request, so nginx (and the main site) still starts when the
    # ads backend is down or not built yet.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $ads_backend http://ads-backend:5000;

    # Locations below set caching with "expires", not add_header, so these headers
    # are inherited everywhere (any add_header in a location would drop them).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.fbcdn.net https://*.facebook.com; media-src 'self' blob:; frame-src https://www.facebook.com https://business.facebook.com; style-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # A missing page gets the console's own "Page not found" (the API's 404s stay JSON: they come from Flask).
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Local development only (docker-compose.dev.yml mounts ads/dev/media here); 404 in production.
    location /dev-media/ {
        root /srv;
        try_files $uri =404;
    }

    location /fonts/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /api/auth/login {
        limit_req zone=adslogin burst=5 nodelay;
        # 429, not nginx's default 503: the sign-in page says "too many tries" instead of "server down".
        limit_req_status 429;
        proxy_pass $ads_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # Turning on full access re-checks the password (FU-D): the same rate limit as signing in.
    location = /api/auth/full-access {
        limit_req zone=adslogin burst=5 nodelay;
        limit_req_status 429;
        proxy_pass $ads_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # Previews Claude made on the Mac for a conversation (`desk attach`, FU-D): videos up to 60 MB.
    location ~ ^/api/agent/tasks/[0-9]+/attachments$ {
        client_max_body_size 70m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass $ads_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # Ad media goes through the dashboard to Meta (videos up to 250 MB).
    location = /api/media/upload {
        client_max_body_size 260m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass $ads_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # The same for Claude's renders from the Mac (`desk upload`): 9:16 videos run past 2 MB.
    location = /api/agent/media/upload {
        client_max_body_size 260m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass $ads_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location /api/ {
        proxy_pass $ads_backend;
        proxy_read_timeout 120s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # Meta's lead pings. The body reaches Flask byte for byte for the signature check.
    location /webhooks/ {
        proxy_pass $ads_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
