<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Sign in | Edge Bourne Ads</title>
  <link rel="icon" href="/img/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png">
  <meta name="theme-color" content="#F6F6F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0F11" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="EB Ads">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/tokens.css?v=1794700000">
  <link rel="stylesheet" href="/css/app.css?v=1795200000">
  <link rel="stylesheet" href="/css/shell.css?v=1795000000">
</head>
<body>
  <main class="login-page">
    <section class="login-side">
      <a class="brand" href="/"><img src="/img/favicon.svg" alt=""><span>Edge Bourne Ads</span></a>
      <div>
        <h1>Every lead, while it's still warm.</h1>
        <p>New intro-call requests land here the moment someone fills in the form, with who they are and which ad brought them.</p>
      </div>
      <p>Edge Bourne Consulting</p>
    </section>
    <form class="login-form" id="login" novalidate>
      <h2>Sign in</h2>
      <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label><input class="input" id="password" name="password" type="password" autocomplete="current-password" required></div>
      <label class="check"><input type="checkbox" name="remember" checked> Keep me signed in on this device</label>
      <p class="note bad" id="login-error" role="alert" hidden></p>
      <button class="btn btn-primary" type="submit">Sign in</button>
      <p class="muted small flush">Forgot your password? Ask your admin to reset it from the Team page.</p>
    </form>
  </main>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
