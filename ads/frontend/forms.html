<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lead forms | Edge Bourne Ads</title>
  <link rel="icon" href="/img/favicon.svg">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="app">
    <aside class="rail"></aside>
    <main class="main">
      <header class="page-head">
        <a class="crumb" href="/ads.html" id="crumb">Ads</a>
        <h1>Lead forms</h1>
        <span class="spacer"></span>
        <button type="button" class="btn btn-primary" id="new-form">New form</button>
      </header>
      <div class="content stack">
        <section class="panel builder-wrap" id="builder" hidden></section>
        <section class="panel">
          <div class="panel-head"><h2>Your forms</h2><p>On the Facebook Page. Meta doesn't let a form change once it's made, so copy one to make a new version.</p></div>
          <div class="panel-body" id="list"><p class="muted">Loading from Meta…</p></div>
        </section>
      </div>
    </main>
  </div>
  <script type="module" src="/js/forms.js"></script>
</body>
</html>
