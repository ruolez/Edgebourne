<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Leads | Edge Bourne Ads</title>
  <link rel="icon" href="/img/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png">
  <meta name="theme-color" content="#F6F6F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0F11" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="EB Ads">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/tokens.css?v=1794700000">
  <link rel="stylesheet" href="/css/app.css?v=1795300000">
  <link rel="stylesheet" href="/css/shell.css?v=1795000000">
</head>
<body>
  <div class="app">
    <aside class="rail"></aside>
    <main class="main">
      <header class="page-head">
        <h1>Leads</h1>
        <p class="response-line" id="response" hidden></p>
      </header>
      <div class="leads-bar">
        <div class="filters" id="filters" role="group" aria-label="Show leads"></div>
        <select class="input tool" id="why" aria-label="Why they were lost" hidden></select>
        <div class="search">
          <span id="search-icon"></span>
          <label class="sr-only" for="q">Search leads</label>
          <input class="input" id="q" type="search" placeholder="Search leads">
        </div>
        <select class="input tool" id="source" aria-label="Which campaign or ad"><option value="">All campaigns and ads</option></select>
        <select class="input tool" id="follow" aria-label="Follow-ups"><option value="">Any follow-up</option></select>
        <label class="check"><input type="checkbox" id="tests"> Show test leads</label>
        <label class="check" id="junk-wrap" hidden><input type="checkbox" id="junk-only"> <span id="junk-label">Only junk</span></label>
        <button type="button" class="btn btn-quiet" id="clear-filters" hidden>Clear filters</button>
      </div>
      <p class="why-note" id="why-note" hidden></p>
      <div class="leads-layout" id="layout">
        <section class="panel lead-list" aria-label="Lead list"><ol id="list"></ol></section>
        <section class="lead-detail-wrap"><div class="panel lead-detail" id="detail" aria-live="polite"></div></section>
      </div>
    </main>
  </div>
  <script type="module" src="/js/leads.js"></script>
</body>
</html>
