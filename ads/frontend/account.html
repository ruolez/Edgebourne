<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Your account | Edge Bourne Ads</title>
  <link rel="icon" href="/img/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png">
  <meta name="theme-color" content="#F6F6F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0F11" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="EB Ads">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/tokens.css?v=1794521000">
  <link rel="stylesheet" href="/css/app.css?v=1794521000">
  <link rel="stylesheet" href="/css/shell.css?v=1794521000">
</head>
<body>
  <div class="app">
    <aside class="rail"></aside>
    <main class="main">
      <header class="page-head"><h1>Your account</h1></header>
      <div class="content stack narrow">
        <p class="note warn" id="first-note" hidden>Set your own password before you start. The one you signed in with was temporary.</p>
        <section class="panel me-card" aria-label="You">
          <div class="panel-body row">
            <span class="avatar big" id="me-initials" aria-hidden="true"></span>
            <span class="me-who"><b id="me-name"></b><small id="me-email"></small><small id="me-role"></small></span>
            <span class="spacer"></span>
            <button class="btn" type="button" id="account-signout">Sign out</button>
          </div>
        </section>
        <section class="panel">
          <div class="panel-head"><h2>Password</h2><p>Changing it signs you out on your other devices.</p></div>
          <form class="panel-body stack" id="pw-form" novalidate>
            <div class="field"><label for="current">Current password</label><input class="input" id="current" name="current" type="password" autocomplete="current-password"></div>
            <div class="field"><label for="new">New password</label><input class="input" id="new" name="new" type="password" autocomplete="new-password"><span class="hint">At least 10 characters.</span></div>
            <div><button class="btn btn-primary" type="submit">Change password</button></div>
          </form>
        </section>
        <section class="panel" id="appearance">
          <div class="panel-head"><h2>Appearance</h2><p>For this device.</p></div>
          <div class="panel-body row">
            <div class="segmented" role="group" aria-label="Theme" id="theme-choice">
              <button type="button" data-theme-choice="system">Match my device</button>
              <button type="button" data-theme-choice="light">Light</button>
              <button type="button" data-theme-choice="dark">Dark</button>
            </div>
          </div>
        </section>
        <section class="panel">
          <div class="panel-head"><h2>Lead alerts</h2></div>
          <div class="panel-body stack">
            <label class="check"><input type="checkbox" id="notify"><span>Email me when a new lead arrives in my campaigns</span></label>
            <label class="check"><input type="checkbox" id="remind"><span>Remind me about leads nobody has contacted<span class="explain">After 5 minutes if they're mine; admins also after an hour, and a list at 8 AM.</span></span></label>
            <label class="check" id="alerts-row" hidden><input type="checkbox" id="alerts-on"><span>Tell me when something is wrong with the ads<span class="explain">Rejected ads, no delivery, tired ads, overspend, no leads. The rules are in <a href="/settings.html#alerts">Settings → Alerts</a>.</span></span></label>
            <div class="tg-box" id="tg" aria-live="polite"></div>
          </div>
        </section>
        <section class="panel" id="device">
          <div class="panel-head"><h2>This device</h2><p>The app and notifications</p></div>
          <div class="panel-body stack tight">
            <div id="install-box"></div>
            <div id="push-box" aria-live="polite"><p class="muted flush">Checking this browser…</p></div>
            <div id="devices"></div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script type="module" src="/js/account.js"></script>
</body>
</html>
