<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inbox | Edge Bourne Ads</title>
  <link rel="icon" href="/img/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png">
  <meta name="theme-color" content="#F6F6F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0F11" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="EB Ads">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/tokens.css?v=1794342631">
  <link rel="stylesheet" href="/css/app.css?v=1794342631">
  <link rel="stylesheet" href="/css/shell.css?v=1794342631">
</head>
<body>
  <div class="app">
    <aside class="rail"></aside>
    <main class="main">
      <header class="page-head">
        <h1>Inbox</h1>
        <p class="page-sub" id="ib-sub"></p>
        <span class="spacer"></span>
        <button class="btn" type="button" id="ib-all" hidden>Mark all read</button>
      </header>
      <div class="content">
        <div class="ib-filters" role="tablist" aria-label="Show" id="ib-filters"></div>
        <div class="ib-layout">
          <ul class="ib-list" id="ib-list" aria-live="polite"><li class="muted">Loading…</li></ul>
          <section class="ib-detail panel" id="ib-detail" aria-live="polite"></section>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="/js/inbox.js"></script>
</body>
</html>
