<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team | Edge Bourne Ads</title>
  <link rel="icon" href="/img/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png">
  <meta name="theme-color" content="#0D7468">
  <meta name="apple-mobile-web-app-title" content="EB Ads">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="app">
    <aside class="rail"></aside>
    <main class="main">
      <header class="page-head"><h1>Team</h1><span class="spacer"></span><button class="btn btn-primary" id="add-btn" type="button">Add teammate</button></header>
      <div class="content stack">
        <p class="muted flush lede">Teammates see and work the leads from the campaigns you give them. Admins see everything and can change settings.</p>
        <section class="panel scroll-x"><table class="table" id="team-table"></table></section>
      </div>
      <dialog id="member-dialog">
        <form method="dialog" id="member-form" novalidate>
          <h2 id="member-title">Add teammate</h2>
          <div class="grid-2">
            <div class="field"><label for="m-name">Name</label><input class="input" id="m-name" name="name"></div>
            <div class="field"><label for="m-email">Email</label><input class="input" id="m-email" name="email" type="email"></div>
          </div>
          <div class="field"><label for="m-role">Access</label>
            <select class="input" id="m-role" name="role"><option value="member">Team member: their campaigns' leads</option><option value="client">Client: this account's results and leads, read-only</option><option value="admin">Admin: everything, every account, including settings</option></select></div>
          <fieldset class="field bare"><legend class="legend">Campaigns</legend><div id="m-campaigns" class="stack tight"></div></fieldset>
          <div class="dialog-actions"><button class="btn" value="cancel" type="button" id="m-cancel">Cancel</button><button class="btn btn-primary" type="submit" id="m-save">Add teammate</button></div>
        </form>
      </dialog>
      <dialog id="pw-dialog">
        <form method="dialog">
          <h2>Temporary password</h2>
          <p class="flush">Give this to <b id="pw-who"></b>. They'll be asked to choose their own the first time they sign in. It won't be shown again.</p>
          <div class="secret-box" id="pw-value"></div>
          <div class="dialog-actions"><button class="btn btn-primary" value="ok">Done</button></div>
        </form>
      </dialog>
    </main>
  </div>
  <script type="module" src="/js/team.js"></script>
</body>
</html>
