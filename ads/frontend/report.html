<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Report | Edge Bourne Ads</title>
  <link rel="icon" href="/img/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#F6F6F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0F11" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/tokens.css?v=1794700000">
  <link rel="stylesheet" href="/css/app.css?v=1795100000">
  <link rel="stylesheet" href="/css/shell.css?v=1795000000">
</head>
<body>
  <div class="app" id="app">
    <aside class="rail"></aside>
    <main class="main">
      <header class="page-head no-print">
        <h1>Reports</h1>
        <div class="segmented" id="kind" role="group" aria-label="Report by">
          <button type="button" data-kind="week">Week</button>
          <button type="button" data-kind="month">Month</button>
        </div>
        <label class="period-pick" id="period-box" hidden><span class="sr-only" id="period-label">Which week</span><select class="input tool" id="period" aria-labelledby="period-label"></select></label>
        <span class="spacer"></span>
        <button type="button" class="btn" id="share" hidden>Share a link…</button>
        <button type="button" class="btn btn-primary" id="pdf">Print or save as PDF</button>
      </header>
      <div class="content" id="report-wrap">
        <section class="panel rv-bar no-print" id="rv-bar" aria-labelledby="rv-title" hidden>
          <div class="rv-top"><h2 class="sr-only" id="rv-title">Before it goes out</h2><div class="rv-state" id="rv-state" aria-live="polite"></div></div>
          <div class="rv-numbers stack tight" id="rv-numbers" hidden></div>
          <form class="rv-form stack tight" id="rv-form" novalidate>
            <div class="field"><label for="rv-note">Our note (optional)</label>
              <textarea class="input" id="rv-note" name="note" rows="5" maxlength="2000" aria-describedby="rv-note-hint rv-count"
                placeholder="Anything the numbers don't say: why an ad was turned off, what we're trying next, a question for them."></textarea>
              <span class="hint" id="rv-note-hint">Shown first in the report and the email. Clients see it once the report goes out.</span>
              <span class="hint" id="rv-count" aria-live="polite" hidden></span></div>
            <div class="row"><button class="btn" type="submit" id="rv-note-save">Save note</button></div>
          </form>
          <details class="fold rv-preview" id="rv-preview"><summary>Preview the email</summary><div class="rv-mailbox" id="rv-mailbox"><p class="muted flush">Loading…</p></div></details>
          <div class="row rv-acts" id="rv-acts">
            <button class="btn btn-primary" type="button" id="rv-send" hidden>Send now</button>
            <button class="btn" type="button" id="rv-later" hidden>Send at 8 AM</button>
            <button class="btn" type="button" id="rv-hold" hidden>Hold it</button>
            <button class="btn" type="button" id="rv-unskip" hidden>Send it after all</button>
            <button class="btn" type="button" id="rv-sent" hidden>See what was sent</button>
            <button class="btn" type="button" id="rv-resend" hidden>Send again with today's figures</button>
            <button class="btn btn-quiet" type="button" id="rv-skip" hidden>Don't send this one</button>
          </div>
        </section>
        <p class="note rv-asent no-print" id="rv-asent" hidden></p>
        <article class="rp-doc" id="report"><div class="skeleton" role="status"><span></span><span></span><span></span><p>Loading…</p></div></article>
      </div>
    </main>
  </div>
  <script type="module" src="/js/report.js"></script>
</body>
</html>
