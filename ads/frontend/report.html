<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Report | Edge Bourne Ads</title>
  <link rel="icon" href="/img/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#F6F6F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0F11" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/tokens.css?v=1794342631">
  <link rel="stylesheet" href="/css/app.css?v=1794342631">
  <link rel="stylesheet" href="/css/shell.css?v=1794342631">
</head>
<body>
  <div class="app" id="app">
    <aside class="rail"></aside>
    <main class="main">
      <header class="page-head no-print">
        <h1>Reports</h1>
        <div class="segmented" id="kind" role="group" aria-label="Period">
          <button type="button" data-kind="week">Last week</button>
          <button type="button" data-kind="month">Last month</button>
        </div>
        <span class="spacer"></span>
        <button type="button" class="btn" id="share" hidden>Share a link</button>
        <button type="button" class="btn btn-primary" id="pdf">Download PDF</button>
      </header>
      <div class="content" id="report-wrap"><article class="report" id="report"><p class="muted">Loading…</p></article></div>
    </main>
  </div>
  <script type="module" src="/js/report.js"></script>
</body>
</html>
