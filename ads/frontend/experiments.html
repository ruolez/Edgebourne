<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Tests | Edge Bourne Ads</title>
  <link rel="icon" href="/img/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png">
  <meta name="theme-color" content="#F6F6F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0F11" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="EB Ads">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/tokens.css?v=1794700000">
  <link rel="stylesheet" href="/css/app.css?v=1794800000">
  <link rel="stylesheet" href="/css/shell.css?v=1794700000">
</head>
<body>
  <div class="app">
    <aside class="rail"></aside>
    <main class="main">
      <header class="page-head">
        <h1>Tests</h1>
        <div class="filters" id="show" role="group" aria-label="Show tests">
          <button type="button" class="view-chip" data-show="running">Running <span class="n" data-n="running"></span></button>
          <button type="button" class="view-chip" data-show="finished">Finished <span class="n" data-n="finished"></span></button>
          <button type="button" class="view-chip" data-show="all">All <span class="n" data-n="all"></span></button>
        </div>
        <span class="spacer"></span>
        <button type="button" class="btn btn-primary" id="new-test">New test</button>
      </header>
      <div class="content stack" id="tests" aria-live="polite"></div>
    </main>
  </div>
  <script type="module" src="/js/experiments.js"></script>
</body>
</html>
