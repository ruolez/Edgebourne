<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Claude | Edge Bourne Ads</title>
  <link rel="icon" href="/img/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png">
  <meta name="theme-color" content="#F6F6F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0F11" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="EB Ads">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/tokens.css?v=1795159108">
  <link rel="stylesheet" href="/css/app.css?v=1795159108">
  <link rel="stylesheet" href="/css/shell.css?v=1795159108">
  <link rel="stylesheet" href="/css/desk.css?v=1795159108">
</head>
<body>
  <div class="app">
    <aside class="rail"></aside>
    <main class="main">
      <header class="page-head" id="view-head" hidden><h1 id="view-h"></h1><p class="page-sub" id="view-sub"></p></header>
      <div class="content desk">
        <div class="convs" id="convs" data-mode="list">
          <aside class="cl" aria-label="Conversations">
            <div class="cl-top">
              <div class="cl-bar">
                <a class="btn btn-claude cl-new" href="#new">New conversation</a>
                <button class="cl-mac" type="button" id="mac-open" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="11.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 20h7M12 16v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="led" id="mac-led" aria-hidden="true"></span><span class="sr-only" id="mac-summary">Your Mac</span></button>
              </div>
              <input class="input cl-search" id="search" type="search" placeholder="Search conversations" aria-label="Search conversations" autocomplete="off">
            </div>
            <div class="cl-list" id="cl-list"></div>
          </aside>
          <section class="cv" id="cv" aria-label="Conversation">
            <header class="cv-head" id="cv-head"></header>
            <div class="cv-body">
              <div class="cv-scroll" id="cv-scroll"><div class="cv-col" id="cv-col" aria-live="polite"></div></div>
              <button class="cv-jump" type="button" id="cv-jump" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="cv-jump-text">Latest</span></button>
            </div>
            <div class="cv-dock" id="cv-dock">
              <div class="cv-dock-in">
                <form class="cv-box" id="ask-form" novalidate>
                  <div class="cv-chip" id="cv-chip" hidden></div>
                  <div class="cv-files" id="cv-files" aria-label="Files to send with your message" hidden></div>
                  <label for="prompt" class="sr-only">Your message to Claude</label>
                  <textarea id="prompt" name="prompt" rows="1" maxlength="4000"></textarea>
                  <div class="cv-box-foot">
                    <button class="cv-tool" type="button" id="file-add" aria-label="Add a picture or video" title="Add a picture or video"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 11.5l-7.2 7.2a4.4 4.4 0 0 1-6.2-6.2l7.9-7.9a3 3 0 0 1 4.2 4.2l-7.8 7.8a1.5 1.5 0 0 1-2.2-2.1l7-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                    <input class="sr-only" type="file" id="file-input" tabindex="-1" aria-hidden="true" multiple>
                    <select class="input cv-scope" id="campaign" name="campaign_id" aria-label="Campaign"><option value="">All campaigns</option></select>
                    <div class="fa-bar" id="fa-bar" hidden></div>
                    <span class="cv-grow"></span>
                    <span class="cv-btns" id="cv-btns"></span>
                  </div>
                </form>
                <p class="cv-hint" id="cv-hint" role="status" hidden></p>
                <div class="cv-seeds" id="cv-seeds" hidden>
                  <button type="button" data-seed="review">Review the last 7 days against target</button>
                  <button type="button" data-seed="question">Why did cost per lead change?</button>
                  <button type="button" data-seed="creative">Three new ad ideas</button>
                  <button type="button" data-seed="research">What are competitors running?</button>
                </div>
              </div>
            </div>
            <div class="cv-drop" id="cv-drop" hidden>Drop to add to your message</div>
          </section>
        </div>
        <div class="stack desk-view" id="view" hidden></div>
      </div>
      <div class="cv-undo" id="undo-bar" role="status" hidden></div>
    </main>
  </div>
  <dialog class="mac-dialog" id="mac-dialog" aria-labelledby="mac-title">
    <h2 id="mac-title">Your Mac</h2>
    <div class="stack" id="mac-body"></div>
    <div class="row end"><button class="btn" type="button" id="mac-close">Close</button></div>
  </dialog>
  <script type="module" src="/js/desk.js"></script>
</body>
</html>
