<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude | Edge Bourne Ads</title>
  <link rel="icon" href="/img/favicon.svg">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="app">
    <aside class="rail"></aside>
    <main class="main">
      <header class="page-head">
        <h1>Claude</h1>
        <span class="mac-status" id="mac-status" role="status"></span>
        <span class="spacer"></span>
        <button class="btn btn-claude-outline" type="button" id="ask-open" aria-expanded="false" aria-controls="composer">Ask Claude</button>
      </header>
      <nav class="tabs" id="views" role="tablist" aria-label="Claude's work">
        <button type="button" role="tab" data-view="waiting" id="tab-waiting" aria-controls="view">Waiting for you</button>
        <button type="button" role="tab" data-view="ads" id="tab-ads" aria-controls="view">By ad</button>
        <button type="button" role="tab" data-view="runs" id="tab-runs" aria-controls="view">All runs</button>
        <button type="button" role="tab" data-view="schedules" id="tab-schedules" aria-controls="view">Schedules</button>
      </nav>
      <div class="content stack desk">
        <section class="panel composer" id="composer" aria-labelledby="ask-title" hidden>
          <form class="panel-body stack" id="ask-form" novalidate>
            <h2 class="composer-title" id="ask-title">Ask Claude</h2>
            <div class="segmented kinds" id="kinds" role="radiogroup" aria-label="What kind of help">
              <button type="button" role="radio" data-kind="question">Question</button>
              <button type="button" role="radio" data-kind="review">Review results</button>
              <button type="button" role="radio" data-kind="research">Research competitors</button>
              <button type="button" role="radio" data-kind="creative">New ad ideas</button>
            </div>
            <div class="field">
              <label for="prompt" class="sr-only">Your direction for Claude</label>
              <textarea class="input" id="prompt" name="prompt" rows="3" maxlength="4000"></textarea>
            </div>
            <div class="row composer-foot">
              <div class="field inline-field">
                <label for="campaign">Campaign</label>
                <select class="input" id="campaign" name="campaign_id"><option value="">All campaigns</option></select>
              </div>
              <span class="spacer"></span>
              <button class="btn" type="button" id="ask-close">Close</button>
              <button class="btn btn-claude" type="submit">Send to Claude</button>
            </div>
            <p class="muted small flush" id="ask-hint"></p>
          </form>
        </section>

        <div id="working" aria-live="polite"></div>
        <div class="stack" id="view" role="tabpanel" aria-live="polite"></div>

        <details class="panel mac-panel" id="mac-panel">
          <summary class="panel-body"><b>Your Mac</b> <span class="muted" id="mac-summary"></span></summary>
          <div class="panel-body stack" id="mac-body"></div>
        </details>
      </div>
    </main>
  </div>
  <script type="module" src="/js/desk.js"></script>
</body>
</html>
