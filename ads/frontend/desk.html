<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Claude | Edge Bourne Ads</title>
  <link rel="icon" href="/img/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png">
  <meta name="theme-color" content="#F6F6F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0F11" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="EB Ads">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/tokens.css?v=1794449562">
  <link rel="stylesheet" href="/css/app.css?v=1794449562">
  <link rel="stylesheet" href="/css/shell.css?v=1794449562">
  <link rel="stylesheet" href="/css/desk.css?v=1794358800">
</head>
<body>
  <div class="app">
    <aside class="rail"></aside>
    <main class="main">
      <div class="content desk">
        <div class="convs" id="convs" data-mode="list">
          <aside class="cl" aria-label="Conversations">
            <div class="cl-top">
              <a class="btn btn-claude cl-new" href="#new">New conversation</a>
              <input class="input cl-search" id="search" type="search" placeholder="Search conversations" aria-label="Search conversations" autocomplete="off">
            </div>
            <div class="cl-list" id="cl-list"></div>
            <button class="cl-foot" type="button" id="mac-open"><span class="led" id="mac-led" aria-hidden="true"></span><span id="mac-summary"></span></button>
          </aside>
          <section class="cv" id="cv" aria-label="Conversation">
            <header class="cv-head" id="cv-head"></header>
            <div class="cv-scroll" id="cv-scroll"><div class="cv-col" id="cv-col" aria-live="polite"></div></div>
            <div class="cv-dock" id="cv-dock">
              <div class="cv-dock-in">
                <div class="cv-line" id="cv-line" hidden></div>
                <form class="cv-box" id="ask-form" novalidate>
                  <div class="cv-chip" id="cv-chip" hidden></div>
                  <label for="prompt" class="sr-only">Your message to Claude</label>
                  <textarea id="prompt" name="prompt" rows="2" maxlength="4000"></textarea>
                  <div class="cv-box-foot">
                    <select class="input cv-scope" id="campaign" name="campaign_id" aria-label="Campaign"><option value="">All campaigns</option></select>
                    <span class="cv-hint" id="cv-hint"></span>
                    <span class="cv-btns" id="cv-btns"></span>
                  </div>
                </form>
                <div class="cv-seeds" id="cv-seeds" hidden>
                  <button type="button" data-seed="review">Review the last 7 days against target</button>
                  <button type="button" data-seed="question">Why did cost per lead change?</button>
                  <button type="button" data-seed="creative">Three new ad ideas</button>
                  <button type="button" data-seed="research">What are competitors running?</button>
                </div>
              </div>
            </div>
          </section>
        </div>
        <div class="stack desk-view" id="view" hidden></div>
      </div>
      <div class="cv-undo" id="undo-bar" role="status" hidden></div>
    </main>
  </div>
  <dialog class="mac-dialog" id="mac-dialog" aria-labelledby="mac-title">
    <h2 id="mac-title">Your Mac</h2>
    <div class="stack" id="mac-body"></div>
    <div class="row end"><button class="btn" type="button" id="mac-close">Close</button></div>
  </dialog>
  <script type="module" src="/js/desk.js"></script>
</body>
</html>
