<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Results | Edge Bourne Ads</title>
  <link rel="icon" href="/img/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png">
  <meta name="theme-color" content="#F6F6F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0F11" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="EB Ads">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/tokens.css?v=1794341404">
  <link rel="stylesheet" href="/css/app.css?v=1794341404">
  <link rel="stylesheet" href="/css/shell.css?v=1794341404">
</head>
<body>
  <div class="app">
    <aside class="rail"></aside>
    <main class="main">
      <header class="page-head">
        <h1>Results</h1>
        <div class="segmented" id="range" role="group" aria-label="Period">
          <button type="button" data-range="7">Last 7 days</button>
          <button type="button" data-range="14">14 days</button>
          <button type="button" data-range="30">30 days</button>
        </div>
        <label class="sort" id="campaign-pick" hidden><span class="sr-only">Campaign</span><select class="input" id="campaign"></select></label>
        <span class="spacer"></span>
      </header>
      <div class="content stack" id="perf"></div>
    </main>
  </div>
  <script type="module" src="/js/performance.js"></script>
</body>
</html>
