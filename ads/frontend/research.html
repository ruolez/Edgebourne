<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research | Edge Bourne Ads</title>
  <link rel="icon" href="/img/favicon.svg">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="app">
    <aside class="rail"></aside>
    <main class="main">
      <header class="page-head"><h1>Research</h1></header>
      <div class="content stack research">
        <div class="research-grid">
          <section class="panel">
            <div class="panel-head"><h2>Look it up yourself</h2><p>Meta Ad Library</p></div>
            <form class="panel-body stack tight" id="lib-form" novalidate>
              <div class="field"><label for="q">Search for an advertiser or words in their ads</label><input class="input" id="q" placeholder="e.g. custom software, QuickBooks integration, a competitor's name"></div>
              <div class="row">
                <div class="field inline-field"><label for="country">Country</label><select class="input" id="country"><option value="US">United States</option><option value="ALL">All countries</option></select></div>
                <label class="check"><input type="checkbox" id="active" checked> Running now only</label>
                <span class="spacer"></span>
                <button class="btn btn-primary" type="submit">Open in Ad Library</button>
              </div>
              <div class="chips" id="quick"></div>
            </form>
          </section>
          <section class="panel composer">
            <div class="panel-head"><h2>Ask Claude to research</h2></div>
            <form class="panel-body stack tight" id="ask-form" novalidate>
              <div class="field"><label for="prompt" class="sr-only">What to research</label>
                <textarea class="input" id="prompt" rows="4" placeholder="e.g. What are IT consultants and software agencies in Southern California running on Facebook right now? Which angles and offers repeat, and what should we test?"></textarea></div>
              <div class="row"><span class="muted small" id="mac-line"></span><span class="spacer"></span><button class="btn btn-claude" type="submit">Send to Claude</button></div>
            </form>
          </section>
        </div>
        <h2 class="section-h">Research so far</h2>
        <div class="stack" id="tasks"></div>
      </div>
    </main>
  </div>
  <script type="module" src="/js/research.js"></script>
</body>
</html>
