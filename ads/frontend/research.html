<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research | Edge Bourne Ads</title>
  <link rel="icon" href="/img/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png">
  <meta name="theme-color" content="#F6F6F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0F11" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="EB Ads">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/tokens.css?v=1794342072">
  <link rel="stylesheet" href="/css/app.css?v=1794342072">
  <link rel="stylesheet" href="/css/shell.css?v=1794342072">
</head>
<body>
  <div class="app">
    <aside class="rail"></aside>
    <main class="main">
      <header class="page-head"><h1>Research</h1></header>
      <div class="content stack research">
        <div class="research-grid">
          <section class="panel">
            <div class="panel-head"><h2>Look it up yourself</h2><p>Meta Ad Library</p></div>
            <form class="panel-body stack tight" id="lib-form" novalidate>
              <div class="field"><label for="q">Search for an advertiser or words in their ads</label><input class="input" id="q" placeholder="e.g. custom software, QuickBooks integration, a competitor's name"></div>
              <div class="row">
                <div class="field inline-field"><label for="country">Country</label><select class="input" id="country"><option value="US">United States</option><option value="ALL">All countries</option></select></div>
                <label class="check"><input type="checkbox" id="active" checked> Running now only</label>
                <span class="spacer"></span>
                <button class="btn btn-primary" type="submit">Open in Ad Library</button>
              </div>
              <div class="chips" id="quick"></div>
            </form>
          </section>
          <section class="panel composer">
            <div class="panel-head"><h2>Ask Claude to research</h2></div>
            <form class="panel-body stack tight" id="ask-form" novalidate>
              <div class="field"><label for="prompt" class="sr-only">What to research</label>
                <textarea class="input" id="prompt" rows="4" placeholder="e.g. What are IT consultants and software agencies in Southern California running on Facebook right now? Which angles and offers repeat, and what should we test?"></textarea></div>
              <div class="row"><span class="muted small" id="mac-line"></span><span class="spacer"></span><button class="btn btn-claude" type="submit">Send to Claude</button></div>
            </form>
          </section>
        </div>
        <div class="swipe-layout">
          <section class="panel">
            <div class="panel-head wrap"><h2>Swipe file</h2><p id="swipe-count">Competitor ads worth keeping</p><span class="spacer"></span>
              <div class="segmented" id="swipe-filter" role="group" aria-label="Show">
                <button type="button" data-sf="all" aria-pressed="true">All</button>
                <button type="button" data-sf="long" aria-pressed="false">Running 30+ days</button>
                <button type="button" data-sf="claude" aria-pressed="false">Found by Claude</button>
              </div>
              <button type="button" class="btn btn-small" id="swipe-add">Save an ad</button></div>
            <div class="panel-body stack tight">
              <form class="swipe-form stack tight" id="swipe-form" hidden novalidate>
                <div class="grid-2">
                  <div class="field"><label for="sw-link">Ad Library link</label><input class="input" id="sw-link" name="link" placeholder="https://www.facebook.com/ads/library/?id=…" autocomplete="off"></div>
                  <div class="field"><label for="sw-page">Whose ad</label><input class="input" id="sw-page" name="page_name" placeholder="The Page name" autocomplete="off"></div>
                </div>
                <div class="field"><label for="sw-body">The ad's text <span class="muted">(optional)</span></label><textarea class="input" id="sw-body" name="body" rows="3"></textarea></div>
                <div class="grid-2">
                  <div class="field"><label for="sw-title">Headline <span class="muted">(optional)</span></label><input class="input" id="sw-title" name="title" autocomplete="off"></div>
                  <div class="field"><label for="sw-start">Running since <span class="muted">(from the Library)</span></label><input class="input" type="date" id="sw-start" name="started_on"></div>
                </div>
                <div class="field"><label for="sw-notes">Why it's worth keeping</label><input class="input" id="sw-notes" name="notes" autocomplete="off" placeholder="e.g. Same offer as ours, but the hook names the cost of the problem"></div>
                <div class="row"><button class="btn btn-primary" type="submit">Save</button><button class="btn btn-quiet" type="button" id="swipe-cancel">Cancel</button></div>
              </form>
              <div id="swipes"><p class="muted flush">Loading…</p></div>
            </div>
          </section>
          <section class="panel watched">
            <div class="panel-head"><h2>Watched Pages</h2></div>
            <div class="panel-body stack tight">
              <p class="muted small flush">Claude checks these every week once the <a href="/desk.html#schedules">Competitor check</a> schedule is on, and saves new and long-running ads here.</p>
              <ul class="watch-list" id="watched"></ul>
              <form class="stack tight" id="watch-form" novalidate>
                <div class="field"><label for="w-name">Page name</label><input class="input" id="w-name" name="name" placeholder="A competitor's Facebook Page" autocomplete="off"></div>
                <div class="field"><label for="w-id">Page id <span class="muted">(optional)</span></label><input class="input" id="w-id" name="page_id" inputmode="numeric" autocomplete="off"></div>
                <div class="field"><label for="w-terms">Search words <span class="muted">(optional)</span></label><input class="input" id="w-terms" name="search_terms" placeholder="e.g. custom software Riverside" autocomplete="off"></div>
                <button class="btn btn-small" type="submit">Watch this Page</button>
              </form>
            </div>
          </section>
        </div>
        <h2 class="section-h">Research so far</h2>
        <div class="stack" id="tasks"></div>
      </div>
    </main>
  </div>
  <script type="module" src="/js/research.js"></script>
</body>
</html>
