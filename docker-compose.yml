# Production compose. For local development with live-reload:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:alpine
    container_name: edgebourne-nginx
    ports:
      - "${APP_PORT:-8090}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/edge-direct.conf:/etc/nginx/conf.d/00-edge.conf:ro
      - ./backend/static:/srv/static:ro
      - uploads:/srv/uploads:ro
    depends_on:
      - backend
    restart: unless-stopped
    logging: *default-logging

  backend:
    build: ./backend
    container_name: edgebourne-backend
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=edgebourne
      - POSTGRES_USER=edgebourne
    volumes:
      - uploads:/data/uploads
      # Static files are served by nginx from the host dir; mounting them here
      # too keeps the ?v= cache-buster in sync without an image rebuild.
      - ./backend/static:/app/static:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # Recurring invoices, email retries and Stripe reconciliation. Its own process
  # rather than a thread in Flask: gunicorn runs --preload in production and does
  # NOT in the dev overlay, so a thread would land in the arbiter in one and in a
  # worker in the other -- different behaviour in the code path that generates
  # invoices. It also takes a Postgres advisory lock, so running two is safe.
  scheduler:
    build: ./backend
    container_name: edgebourne-scheduler
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=edgebourne
      - POSTGRES_USER=edgebourne
    command: ["python", "-u", "scheduler.py"]
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

  # Ads console (ads.<domain>): Meta lead inbox, lead alerts and ad performance.
  # Its own Flask app and database (ebads, created on first start) on the same
  # Postgres. nginx routes ads.* to it only behind the shared proxy (see
  # docker-compose.proxy.yml). Meta and SMTP keys are entered in its Settings page.
  ads-backend:
    build: ./ads/backend
    container_name: edgebourne-ads-backend
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=ebads
      - POSTGRES_USER=edgebourne
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_BOOTSTRAP_DB=edgebourne
      - SITE_POSTGRES_DB=edgebourne
      - BASE_SECRET_KEY=${SECRET_KEY}
      - DOMAIN=${DOMAIN:-}
      - APP_BASE_URL=${ADS_BASE_URL:-}
      - ADMIN_EMAIL=${ADS_ADMIN_EMAIL:-eugene@edgebourne.com}
      - ADMIN_INITIAL_PASSWORD=${ADS_ADMIN_INITIAL_PASSWORD:-}
      - GUNICORN_WORKERS=1
      # The Mac bridge holds one thread in a 25 s long poll.
      - GUNICORN_THREADS=8
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M

  postgres:
    image: postgres:16-alpine
    container_name: edgebourne-postgres
    environment:
      - POSTGRES_DB=edgebourne
      - POSTGRES_USER=edgebourne
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    command:
      - postgres
      - "-c"
      - "max_connections=50"
      - "-c"
      - "shared_buffers=128MB"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgebourne -d edgebourne"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

volumes:
  pgdata:
  uploads:
