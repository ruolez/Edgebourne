{% set _p = request.path %}
<header class="site-header">
  <div class="wrap nav">
    <a class="brand" href="/" aria-label="EdgeBourne home">
      <svg viewBox="0 0 190 190" class="brand-seal"><use href="#seal"/></svg>
      <span class="wordmark">Edge<span class="accent">Bourne</span></span>
    </a>
    <nav class="nav-links" id="nav-links" aria-label="Primary">
      <a href="/services"{% if _p.startswith('/services') %} class="is-active" aria-current="page"{% endif %}>Services</a>
      <a href="/work"{% if _p.startswith('/work') %} class="is-active" aria-current="page"{% endif %}>Work</a>
      <a href="/process"{% if _p.startswith('/process') %} class="is-active" aria-current="page"{% endif %}>Process</a>
      <a href="/industries"{% if _p.startswith('/industries') %} class="is-active" aria-current="page"{% endif %}>Industries</a>
      <a href="/about"{% if _p.startswith('/about') %} class="is-active" aria-current="page"{% endif %}>About</a>
      <a href="/blog"{% if _p.startswith('/blog') %} class="is-active" aria-current="page"{% endif %}>Blog</a>
      {% for p in nav_pages %}<a href="/{{ p.slug }}">{{ p.nav_label or p.title }}</a>{% endfor %}
      <a class="btn btn-primary btn-nav" href="/contact">Book a call</a>
    </nav>
    <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav-links">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
